[input]
fits_file="/home/verbena/data/m51_processed_data/m51_central_tile_1hdu.fits"

[parameters]
# Object name substring for filtering (PCA correction will only process spectra containing this substring)
# Example: "M51CENTER" will match only M51CENTER objects, not M51EDGE
object="M51CENTER"

[filters]
blank_fraction = 0.20
remove_aor_id = "04_0116_0010609"

[reduction]
baseline=3
line_window=[450, 550]
extract=[350,700]
group_by = "OBJECT"

[gridding]
# Cygrid provides more accurate astronomical gridding than scipy.griddata
# Cygrid is available in the dedicated ~/.venv/cygrid environment (see VENV_SETUP.md)
# 
# Note: cygrid is optional. If not available, scipy griddata is used as fallback.
method = "cygrid"  # Options: "cygrid" or "scipy" (auto-falls back if cygrid unavailable)
beamsize_arcsec = 14.1  # Beam size in arcseconds
#pixel_size_arcsec = 14.0  # Pixel size in arcseconds (will be calculated from beamsize if not specified)
spectra_weighting = "rmsratio"  # Options: "uniform" or "rmsratio"
channel_weighting = true
telescop = "IRAM-30M"  # Telescope name written to FITS header (must be recognised by CLASS)

[pca_prepare]
fill_with_noise=true
tau_min=0.001
tau_max=1.0
rymin=-1000
rymax=1000

[pca]
n_components = 6
pca_source="SKYCHOPDIFF"
# smooth the components in frequency space by a box car with a
# a kernel length of
smoothing_kernel_size= 25
rolling_noise_window = 15
noise_cutoff = false
cutoff = 0.03
global_noise_ratio_cutoff = false
noise_ratio_cutoff = 2.0
line_kernel_size = 11
line_cutoff_std=2.0
least_squares=true

[filter]
rms_ratio=2.0

[output]
clean_fits = "/home/verbena/data/m51_processed_data/clean_data.fits"
rejected_fits = "/home/diskB/sofiaobsdata/m51/m51_central_fits_output/fits_files_processed/rejected_data.fits"
reduced_fits = "/home/verbena/data/m51_processed_data/reduced_data.fits"
averaged_fits = "/home/diskB/sofiaobsdata/m51/m51_central_fits_output/fits_files_processed/averaged_data.fits"
datacube = "/home/verbena/data/m51_processed_data/datacube.fits"
prepared_for_pca="/home/verbena/data/m51_processed_data/prepared_for_pca.fits"
pcad_fits="/home/verbena/data/m51_processed_data/pca_corrected.fits"
post_filtered_fits="/home/verbena/data/m51_processed_data/postpcarmsr.fits"
postpcarmsr="/home/verbena/data/m51_processed_data/postpcarmsr.fits"
pca_plots_dir="/home/verbena/data/m51_pca_plots/"


