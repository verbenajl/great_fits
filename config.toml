[parameters]
# Object name substring for filtering (PCA correction will only process spectra containing this substring)
# Example: "M51CENTER" will match only M51CENTER objects, not M51EDGE
object="M51CENTER"

[filters]
blank_fraction = 0.20
rmsratio = 1.3

[reduction]
baseline=3
line_window=[450, 550]
extract=[350,700]
group_by = "OBJECT"

[gridding]
# Cygrid provides more accurate astronomical gridding than scipy.griddata
# Cygrid is available in the dedicated ~/.venv/cygrid environment (see VENV_SETUP.md)
# 
# Note: cygrid is optional. If not available, scipy griddata is used as fallback.
method = "cygrid"  # Options: "cygrid" or "scipy" (auto-falls back if cygrid unavailable)
beamsize_arcsec = 14.1  # Beam size in arcseconds
#pixel_size_arcsec = 14.0  # Pixel size in arcseconds (will be calculated from beamsize if not specified)

[pca_prepare]
fill_with_noise=true
rmsratio_value=1.3
tau_min=0.001
tau_max=1.0
rymin=-1000
rymax=1000

[pca]
n_components = 5
pca_source="SKYCHOPDIFF"
# smooth the components in frequency space by a box car with a
# a kernel length of
smoothing_kernel_size=5
rolling_noise_window = 11
noise_cutoff = false
cutoff = false
global_noise_ratio_cutoff = 15
noise_ratio_cutoff = 15
line_kernel_size = 51


[output]
clean_fits = "/home/diskB/sofiaobsdata/m51/m51_central_fits_output/fits_files_processed/clean_data.fits"
rejected_fits = "/home/diskB/sofiaobsdata/m51/m51_central_fits_output/fits_files_processed/rejected_data.fits"
reduced_fits = "/home/diskB/sofiaobsdata/m51/m51_central_fits_output/fits_files_processed/reduced_data.fits"
averaged_fits = "/home/diskB/sofiaobsdata/m51/m51_central_fits_output/fits_files_processed/averaged_data.fits"
datacube = "/home/diskB/sofiaobsdata/m51/m51_central_fits_output/fits_files_processed/datacube.fits"
prepared_for_pca="/home/diskB/sofiaobsdata/m51/m51_central_fits_output/fits_files_processed/prepared_for_pca.fits"
pcad_fits="/home/diskB/sofiaobsdata/m51/m51_central_fits_output/fits_files_processed/pca_corrected.fits"
pca_plots_dir="/home/diskB/sofiaobsdata/m51/m51_central_fits_output/pca_plots"