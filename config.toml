[parameters]
# Object name substring for filtering (PCA correction will only process spectra containing this substring)
# Example: "M51" will match "M51CENTER_UNKNOWN_...", "M51EDGE_...", etc.
object="M51"

[filters]
blank_fraction = 0.20

[reduction]
baseline=3
line_window=[450, 550]
extract=[350,700]
group_by = "OBJECT"

[gridding]
method = "cygrid"  # Options: "cygrid" or "scipy"
beamsize_arcsec = 14.1  # Beam size in arcseconds
#pixel_size_arcsec = 14.0  # Pixel size in arcseconds (will be calculated from beamsize if not specified)

[pca]
n_components = 5
pca_source="SKYCHOPDIFF"
# smooth the components in frequency space by a box car with a
# a kernel length of
smoothing_kernel_size=5
rolling_noise_window = 11
noise_cutoff = false
cutoff = false
global_noise_ratio_cutoff = 30
noise_ratio_cutoff = false
line_kernel_size = 51


[output]
clean_fits = "/home/diskB/sofiaobsdata/m51/m51_central_fits/fits_files_processed/clean_data.fits"
rejected_fits = "/home/diskB/sofiaobsdata/m51/m51_central_fits/fits_files_processed/rejected_data.fits"
